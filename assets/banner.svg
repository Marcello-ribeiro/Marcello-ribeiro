<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Marcello Ribeiro, estudante de Desenvolvimento de Sistemas" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141722"/>
      <stop offset="1" stop-color="#090a0f"/>
    </linearGradient>
    <pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".06"/>
    </pattern>
    <linearGradient id="rosa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4f5"/>
      <stop offset="1" stop-color="#f1e4ff"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#fundo)"/>
  <rect width="1200" height="340" rx="20" fill="url(#pontos)"/>

  <!-- texto -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="104" fill="#8d92a6" font-size="13" font-weight="600" letter-spacing="4">OLÁ, EU SOU</text>
    <text x="68" y="172" fill="#eceef5" font-family="Georgia, 'Times New Roman', serif" font-size="62">Marcello Ribeiro</text>
    <text x="70" y="214" fill="#9399ad" font-size="19">Estudante de Desenvolvimento de Sistemas</text>
    <text x="70" y="242" fill="#6f7488" font-size="15">Web · Bancos de dados · Linux · Cibersegurança</text>

    <g transform="translate(70 270)">
      <rect width="306" height="36" rx="18" fill="#1b1f2b" stroke="#2a2e3c"/>
      <text x="18" y="23" fill="#8d92a6" font-family="Consolas, 'Courier New', monospace" font-size="14">~ $</text>
      <text x="52" y="23" fill="#c9cfe0" font-family="Consolas, 'Courier New', monospace" font-size="14">construindo coisas pra web</text>
      <rect x="284" y="11" width="8" height="15" fill="#c9cfe0">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- colagem: os dois projetos -->
  <g filter="url(#sombra)">
    <g transform="translate(790 64) rotate(-7)">
      <rect width="190" height="230" rx="16" fill="#1b1f2b" stroke="#2f3444"/>
      <rect x="18" y="18" width="154" height="118" rx="10" fill="#0f1118"/>
      <circle cx="118" cy="62" r="26" fill="#eceef5"/>
      <circle cx="146" cy="44" r="10" fill="#9399ad"/>
      <path d="M18 112 Q 70 84 120 104 T 172 98 L172 126 Q172 136 162 136 L28 136 Q18 136 18 126 Z" fill="#2a2e3c"/>
      <text x="20" y="170" fill="#eceef5" font-family="Georgia, serif" font-size="20">SaveVault</text>
      <rect x="20" y="186" width="120" height="7" rx="3.5" fill="#3a3f50"/>
      <rect x="20" y="201" width="80" height="7" rx="3.5" fill="#2a2e3c"/>
      <rect x="62" y="-12" width="70" height="22" rx="2" fill="#c9cfe0" opacity=".28" transform="rotate(4 97 0)"/>
    </g>

    <g transform="translate(960 92) rotate(6)">
      <rect width="176" height="214" rx="4" fill="#ffffff"/>
      <rect x="12" y="12" width="152" height="148" fill="url(#rosa)"/>
      <g fill="none" stroke="#7b087c" stroke-width="1.6" stroke-linecap="round" opacity=".75">
        <path d="M88 150 C86 126 89 104 95 80"/>
        <path d="M88 128 c-11 -6 -14 -14 -12 -20 c7 3 12 11 12 20 Z"/>
        <path d="M90 110 c10 -6 14 -13 13 -19 c-7 3 -12 10 -13 19 Z"/>
        <circle cx="95" cy="70" r="3"/>
        <path d="M95 67 c-4 -6 -3 -11 0 -13 c3 2 4 7 0 13 Z"/>
        <path d="M95 67 c-4 -6 -3 -11 0 -13 c3 2 4 7 0 13 Z" transform="rotate(72 95 70)"/>
        <path d="M95 67 c-4 -6 -3 -11 0 -13 c3 2 4 7 0 13 Z" transform="rotate(144 95 70)"/>
        <path d="M95 67 c-4 -6 -3 -11 0 -13 c3 2 4 7 0 13 Z" transform="rotate(216 95 70)"/>
        <path d="M95 67 c-4 -6 -3 -11 0 -13 c3 2 4 7 0 13 Z" transform="rotate(288 95 70)"/>
      </g>
      <text x="88" y="192" fill="#7b087c" font-family="Georgia, serif" font-size="19" font-style="italic" text-anchor="middle">Milly's Arts</text>
      <rect x="54" y="-11" width="68" height="22" fill="#f7a3e6" opacity=".7" transform="rotate(-5 88 0)"/>
